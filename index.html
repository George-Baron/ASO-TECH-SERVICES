<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASO-TECH SERVICES</title>
<style>
:root{--bg:#eef2f9;--card:#fff;--tx:#0f1b33;--mu:#6b778c;--ln:#e4e9f2;--ac:#1f6feb;--acx:#fff;--gr:#16a34a;--wa:#d97706;--er:#dc2626;--side:#0b1f44;--sidetx:#b4c0da;--sh:0 1px 2px rgba(15,27,51,.05),0 4px 14px rgba(15,27,51,.05);--hd:#f5f7fc;--pill-g:#dcfce7;--pill-gx:#15803d;--pill-o:#ffedd5;--pill-ox:#c2410c;--pill-r:#fee2e2;--pill-rx:#b91c1c}
@media(prefers-color-scheme:dark){:root{--bg:#0a1122;--card:#111a2e;--tx:#e8edf7;--mu:#93a0b8;--ln:#212f4b;--ac:#3b82f6;--gr:#22c55e;--wa:#fbbf24;--er:#f87171;--side:#071230;--sh:0 1px 2px rgba(0,0,0,.3);--hd:#16213a;--pill-g:#14532d66;--pill-gx:#4ade80;--pill-o:#7c2d1266;--pill-ox:#fdba74;--pill-r:#7f1d1d66;--pill-rx:#fca5a5}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
#app{display:flex;min-height:100vh}
aside#side{width:236px;flex-shrink:0;background:var(--side);color:var(--sidetx);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:16px 12px;z-index:30}
.brand{display:flex;gap:10px;align-items:center;color:#fff;font-weight:700;font-size:15px;line-height:1.2;padding:2px 8px 20px}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);display:grid;place-items:center;flex-shrink:0}.logo svg{width:19px;height:19px;stroke:#fff}
nav#nav{display:flex;flex-direction:column;gap:3px;flex:1;overflow-y:auto}
nav a{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:9px;color:var(--sidetx);cursor:pointer;font-weight:500;white-space:nowrap;transition:background .12s}
nav a svg{width:18px;height:18px;flex-shrink:0}
nav a:hover{background:rgba(255,255,255,.07);color:#fff}
nav a.on{background:var(--ac);color:#fff;font-weight:600;box-shadow:0 4px 12px rgba(31,111,235,.35)}
.suser{border-top:1px solid rgba(255,255,255,.1);padding-top:12px;margin-top:10px;display:flex;gap:10px;align-items:center;color:#fff}
.suser small{display:block;color:var(--sidetx);font-size:11px}.suser .nm{flex:1;min-width:0;line-height:1.25}.suser .nm b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.suser button{background:rgba(255,255,255,.1);color:#fff;border:0;padding:6px 9px;border-radius:7px;font-size:12px}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex-shrink:0}
#wrap{flex:1;min-width:0;display:flex;flex-direction:column}
header.top{background:var(--card);border-bottom:1px solid var(--ln);padding:10px 22px;display:flex;gap:12px;align-items:center;position:sticky;top:0;z-index:20}
#menu{display:none;background:transparent;color:var(--tx);border:1px solid var(--ln);padding:6px 8px}#menu svg{width:20px;height:20px;display:block}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ln);border-radius:9px;padding:6px 11px;font-weight:500;background:var(--card);white-space:nowrap}
.pill svg{width:15px;height:15px;color:var(--mu)}
#scw label{display:flex;gap:6px;align-items:center}#scw select{width:auto;padding:5px 8px}
.gs{position:relative;flex:1;max-width:380px}.gs svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--mu)}.gs input{padding-left:34px;background:var(--hd);border-color:transparent}
.ibtn{position:relative;background:transparent;color:var(--tx);border:0;padding:6px;border-radius:8px}.ibtn svg{width:20px;height:20px;display:block}.ibtn i{position:absolute;top:4px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--er);border:2px solid var(--card)}
.hu{display:flex;gap:9px;align-items:center;line-height:1.2}.hu small{display:block;color:var(--mu);font-size:11px}.hu b{font-size:13px}
.sp{flex:1}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gr);margin-right:4px}.dot.off{background:var(--wa)}
main{padding:22px;width:100%;max-width:1320px;margin:0 auto}
h2{margin:0 0 4px;font-size:22px;font-weight:700;letter-spacing:-.01em}h3{margin:0 0 12px;font-size:15px;font-weight:650}h4{margin:14px 0 6px;font-size:13px}
.sub{color:var(--mu);margin:0 0 18px}
button{background:var(--ac);color:var(--acx);border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit;font-weight:600;transition:filter .12s}button:hover{filter:brightness(1.08)}button:disabled{cursor:not-allowed}
button.b2{background:var(--card);color:var(--tx);border:1px solid var(--ln);font-weight:500}button.b2:hover{background:var(--hd);filter:none}button.sm{padding:4px 10px;font-size:12px}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--ln);border-radius:8px;background:var(--card);color:var(--tx);width:100%;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(31,111,235,.15)}
label{display:block;font-size:12px;color:var(--mu);font-weight:500}label input,label select{margin-top:4px;color:var(--tx)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px 16px;box-shadow:var(--sh)}.card small{color:var(--mu);display:block;font-size:12px}.card b{font-size:19px}
.kpi{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:16px;box-shadow:var(--sh)}
.kpi .ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}.kpi .ic svg{width:22px;height:22px}
.kpi small{color:var(--mu);display:block;font-size:12px}.kpi b{font-size:21px;display:block;letter-spacing:-.01em;line-height:1.25}.kpi em{font-style:normal;font-size:11.5px;color:var(--mu)}.up{color:var(--gr)!important}.dn_{color:var(--er)!important}
.g2{display:grid;grid-template-columns:3fr 2fr;gap:14px;margin-bottom:14px}.g2 .pn{margin:0}
.pn{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--ln);vertical-align:top}
th{font-size:12px;color:var(--mu);font-weight:600;background:var(--hd);white-space:nowrap}th:first-child{border-radius:8px 0 0 8px}th:last-child{border-radius:0 8px 8px 0}
tbody tr:hover td,table tr:hover td{background:color-mix(in srgb,var(--hd) 60%,transparent)}table tr:last-child td{border-bottom:0}
td input,td select{min-width:70px}td input.dn{min-width:0;width:58px;padding:4px 6px}.ra{text-align:right;white-space:nowrap}
.tb{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}.tb input{max-width:280px}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--ln);color:var(--mu)}
.tag.received,.tag.delivered,.tag.active{background:var(--pill-g);color:var(--pill-gx)}
.tag.partial,.tag.picked,.tag.loaded,.tag.awaiting{background:var(--pill-o);color:var(--pill-ox)}
.tag.expired{background:var(--pill-r);color:var(--pill-rx)}.tag.cancelled{opacity:.6;text-decoration:line-through}
.low{color:var(--er)}
.mb{position:fixed;inset:0;background:rgba(8,16,36,.55);backdrop-filter:blur(2px);display:flex;align-items:flex-start;justify-content:center;padding:28px 10px;overflow:auto;z-index:50}
.md{background:var(--card);border-radius:14px;padding:20px;width:100%;max-width:460px;box-shadow:0 20px 50px rgba(0,0,0,.3)}.md.w{max-width:780px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ac{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.pos{display:grid;grid-template-columns:1fr 370px;gap:14px;align-items:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;cursor:pointer;text-align:left;box-shadow:var(--sh);transition:transform .1s,border-color .1s}.tile:hover{border-color:var(--ac);transform:translateY(-2px)}
.tile .av{width:46px;height:46px;border-radius:12px;margin-bottom:8px;font-size:16px}.tile b{display:block;font-size:13px;line-height:1.25;min-height:32px}.tile .pr{font-weight:700;color:var(--ac);display:block;margin-top:4px}.tile small{color:var(--mu)}
.pos .ac button:not(.b2){background:var(--gr);padding:11px 18px;font-size:15px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.tabs button{background:var(--card);color:var(--tx);border:1px solid var(--ln);font-weight:500;padding:7px 14px;border-radius:999px}.tabs button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.tot td{font-weight:700;background:var(--hd)}.mu{color:var(--mu)}
.login{max-width:420px;margin:7vh auto}.login .pn{padding:26px;box-shadow:0 10px 40px rgba(15,27,51,.12)}.lb{display:flex;gap:11px;align-items:center;margin-bottom:16px;font-weight:700;font-size:17px}.lb .logo{width:40px;height:40px}
.pts{background:color-mix(in srgb,var(--ac) 10%,transparent);border-radius:8px;padding:8px 10px;margin:8px 0}
.chart{width:100%;height:auto;display:block}.chart text{fill:var(--mu);font-size:11px}.chart .gl{stroke:var(--ln)}
.legend{display:grid;gap:8px;font-size:12.5px}.legend div{display:flex;gap:8px;align-items:center}.legend i{width:9px;height:9px;border-radius:50%}.legend span{margin-left:auto;font-weight:600}
.donut{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center}.donut svg{width:170px;height:170px;flex-shrink:0}
#print{display:none}
@media print{body>*:not(#print){display:none!important}#print{display:block;color:#000;background:#fff;padding:10px}#print table th,#print table td{border-bottom:1px solid #999;color:#000;background:#fff}}
#toast{display:none;position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;max-width:90%;cursor:pointer}code{background:var(--ln);padding:1px 5px;border-radius:4px}
body.guest aside#side,body.guest header.top{display:none}
@media(max-width:1000px){.g2{grid-template-columns:1fr}}
.pos>.pn{overflow:hidden}.pos .pn td{padding:8px 4px}.pos .pn td input.dn{width:44px;padding:4px}
@media(max-width:860px){.cards{grid-template-columns:1fr}.kpi{padding:12px;gap:10px}.kpi .ic{width:38px;height:38px}.kpi b{font-size:16px}#net,#brnw+#scw label{display:none}.pill{padding:6px 9px}aside#side{position:fixed;left:0;top:0;transform:translateX(-102%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.4)}body.nav-open aside#side{transform:none}body.nav-open::after{content:"";position:fixed;inset:0;background:rgba(8,16,36,.5);z-index:25}#menu{display:block}.gs,.hu div{display:none}header.top{padding:10px 14px}main{padding:14px}.pos{grid-template-columns:1fr}.fg{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app">
<aside id="side"><div class="brand"><span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-6 9 6v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21V12h6v9"/></svg></span><span id="co">ASO-TECH SERVICES</span></div><nav id="nav"></nav><div class="suser" id="usr"></div></aside>
<div id="wrap"><header class="top"><button id="menu" onclick="document.body.classList.toggle('nav-open')" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button><span class="pill" id="brnw"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h1M14 9h1M9 13h1M14 13h1M9 17h6"/></svg><span id="brn"></span></span><span id="scw"></span>
<div class="gs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="gq" placeholder="Search products…" onkeydown="if(event.key==='Enter'&&can('v:prods')){page='prods';q=this.value;this.value='';render()}"></div>
<span class="sp"></span><span class="mu"><span class="dot" id="dot"></span><span id="net">online</span></span><button class="ibtn" id="bell" title="Low stock" onclick="if(can('v:stock'))go('stock')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><i id="bdot" style="display:none"></i></button><div class="hu" id="hu"></div></header>
<main id="main"></main></div></div>
<div id="modal"></div>
<div id="toast" onclick="this.style.display='none'"></div>

<script>
/* ============ helpers ============ */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round((+n+Number.EPSILON)*100)/100;
const money=n=>(S.settings.currency||'')+(+n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const now=()=>Date.now();
let S=null,U=null,page='dash',acct='journal',rtab='cust',cart=[],disc=0,cust='',redeem=0,apprU=null,q='';
const cur=()=>S.settings.branchId;
const scope=()=>can('scope.all')?(S.settings.scope||cur()):cur();
const inS=x=>scope()==='ALL'||x.branchId===scope();
const br=id=>S.branches.find(b=>b.id===(id||cur()));
const nid=p=>p+'_'+cur()+'_'+now().toString(36)+Math.random().toString(36).slice(2,6);
const nextNo=p=>{const t=CLOUD?devTag():'',k=p+cur()+t;S.seq[k]=(S.seq[k]||0)+1;return p+'-'+br().code+(t?'-'+t:'')+'-'+String(S.seq[k]).padStart(4,'0')};
const prod=id=>S.products.find(x=>x.id===id)||{name:'?',sku:'?',cost:0,price:0};
const pn=id=>(S.partners.find(x=>x.id===id)||{name:'?'}).name;
const tx=p=>p.tax??S.settings.taxRate;
const lc=l=>l.c*(1-(l.d||0)/100);
const locName=id=>(S.locations.find(l=>l.id===id)||{name:id}).name;
const locOf=(type,b)=>S.locations.find(l=>l.branchId===(b||cur())&&l.type===type);
const touch=o=>(o.u=now(),o);
const paid=(k,id)=>S.payments.filter(p=>p.kind===k&&p.doc===id).reduce((a,p)=>a+p.amt,0);
const credited=(k,id)=>S.returns.filter(r=>r.docKind===k&&r.docId===id).reduce((a,r)=>a+r.credit,0);
const invDue=i=>r2(i.total-credited('inv',i.id)-paid('inv',i.id));
const billDue=b=>r2(b.total-credited('bill',b.id)-paid('bill',b.id));
const ptBal=c=>S.points.filter(p=>p.cust===c).reduce((a,p)=>a+p.pts,0);
function stockIdx(b){b=b||scope();const m={};for(const x of S.moves)if(b==='ALL'||x.branchId===b){const k=x.loc+'|'+x.p;m[k]=(m[k]||0)+x.q}return m}
function tot(){const m={};for(const x of S.moves)if(inS(x))m[x.p]=(m[x.p]||0)+x.q;return m}
function totalQty(p){let t=0;for(const x of S.moves)if(x.p===p)t+=x.q;return t}
function je(ref,memo,lines,o){o=o||{};lines=lines.map(l=>{const x={acc:l.acc,dr:r2(l.dr||0),cr:r2(l.cr||0)};if(l.fa!==undefined)x.fa=r2(l.fa);return x}).filter(l=>l.dr||l.cr);
 const d=r2(lines.reduce((a,l)=>a+l.dr,0)),c=r2(lines.reduce((a,l)=>a+l.cr,0));if(d!==c)throw new Error('Unbalanced journal entry');
 if(!lines.length)return;const date=o.date||today();chkPeriod(date);
 const j={id:nid('J'),no:nextNo('JE'),date,t:now(),branchId:cur(),ref,memo,lines,by:U?U.id:''};if(o.closing)j.closing=true;if(o.fx)j.fx=o.fx;S.journals.push(j);return j}
function log(act,detail){S.audit.push({id:nid('A'),t:now(),branchId:cur(),user:U?U.name:'-',act,detail:detail||''})}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type||'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function printDoc(h){$('#print').innerHTML=h;window.print()}
function modal(h,w){$('#modal').innerHTML=`<div class="mb" onmousedown="if(event.target===this)closeM()"><div class="md ${w?'w':''}">${h}</div></div>`}
function closeM(){$('#modal').innerHTML=''}

/* ============ SHA-256 (for passwords) ============ */
function sha256(str){str=unescape(encodeURIComponent(str));
 const rr=(v,a)=>(v>>>a)|(v<<(32-a)),mp=Math.pow,mw=mp(2,32),words=[],bl=str.length*8;let hash=[],k=[],pc=0,comp={},result='';
 for(let c=2;pc<64;c++)if(!comp[c]){for(let i=0;i<313;i+=c)comp[i]=c;hash[pc]=(mp(c,.5)*mw)|0;k[pc++]=(mp(c,1/3)*mw)|0}
 str+='\x80';while(str.length%64-56)str+='\x00';
 for(let i=0;i<str.length;i++)words[i>>2]|=str.charCodeAt(i)<<((3-i)%4)*8;
 words[words.length]=(bl/mw)|0;words[words.length]=bl;
 for(let j=0;j<words.length;){const w=words.slice(j,j+=16),old=hash;hash=hash.slice(0,8);
  for(let i=0;i<64;i++){const w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4];
   const t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10))|0));
   const t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
   hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0}
  for(let i=0;i<8;i++)hash[i]=(hash[i]+old[i])|0}
 for(let i=0;i<8;i++)for(let j=3;j+1;j--){const b=(hash[i]>>(j*8))&255;result+=((b<16)?0:'')+b.toString(16)}
 return result}
const hashPw=(u,pw)=>sha256(u.salt+':'+u.username+':'+pw);
function mkUser(name,username,role,branchId,pw){const salt=Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2);username=username.trim().toLowerCase();
 const u={id:'U'+Math.random().toString(36).slice(2,9),name,username,role,branchId:branchId||'ALL',salt,active:true,u:now()};u.hash=hashPw(u,pw);return u}

/* ============ roles & permissions ============ */
const ROLES={
 admin:{label:'Administrator',p:['*']},
 manager:{label:'Manager',p:['v:dash','v:pos','v:po','v:stock','v:dos','v:ret','v:prods','v:partners','v:acct','v:set','scope.all','sync','audit','pos.sell','pos.disc','pos.disc.high','po.create','po.receive','bill.create','pay','stock.move','stock.adjust','do.create','do.pick','do.load','do.deliver','prod.edit','partner.edit','return.make','return.approve','return.vendor','je.manual','loyalty.adjust','putaway.edit','landed.cost','po.approve','vendor.price','bill.override','pos.session','period.close']},
 purchasing:{label:'Purchasing',p:['v:dash','v:po','v:stock','v:prods','v:partners','v:ret','po.create','bill.create','landed.cost','vendor.price','prod.edit','partner.edit','return.vendor']},

function calc(){
 const L=cart.map(l=>{const p=prod(l.p),g=r2(l.q*p.price),a0=r2(g-g*(l.d||0)/100),a=r2(a0-a0*disc/100);return{p:l.p,q:l.q,price:p.price,d:l.d||0,g,tr:tx(p),cost:p.cost,a}});
 const sub=r2(L.reduce((s,l)=>s+l.a,0)),isC=cust&&cust!=='P_walkin'&&S.settings.loyOn;
 let rv=0;
 if(isC&&redeem>0){let pts=Math.min(Math.floor(redeem),Math.max(0,ptBal(cust)));const cap=r2(sub*S.settings.loyMax/100);let v=r2(pts*S.settings.loyVal);if(v>cap){pts=Math.floor(cap/S.settings.loyVal);v=r2(pts*S.settings.loyVal)}rv=pts>=S.settings.loyMin?v:0}
 let left=rv;L.forEach((l,i)=>{const share=i===L.length-1?left:r2(rv*(sub?l.a/sub:0));l.rv=Math.min(share,l.a);left=r2(left-l.rv);l.net=r2(l.a-l.rv);l.tax=r2(l.net*l.tr/100)});
 const gross=r2(L.reduce((s,l)=>s+l.g,0)),net=r2(L.reduce((s,l)=>s+l.net,0)),tax=r2(L.reduce((s,l)=>s+l.tax,0)),rvT=r2(L.reduce((s,l)=>s+l.rv,0));
 return{lines:L,gross,disc:r2(gross-net),net,tax,total:r2(net+tax),rv:rvT,pts:S.settings.loyVal?Math.round(rvT/S.settings.loyVal):0,earn:isC?Math.floor(net/S.settings.loyAmt*S.settings.loyPer):0,maxD:Math.max(disc,0,...cart.map(l=>l.d||0))}}

const r3=n=>Math.round((+n+Number.EPSILON)*1000)/1000;

const addDays=(d,n)=>{const t=new Date(d+'T12:00:00');t.setDate(t.getDate()+n);return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')};
const daysTo=e=>Math.round((new Date(e+'T12:00:00')-new Date(today()+'T12:00:00'))/864e5);
const tracked=p=>{const t=prod(p).track;return t==='lot'||t==='serial'};
const lotExp=(p,no)=>{const l=S.lots.find(x=>x.p===p&&x.no===no);return l?l.exp||'':''};

function lotStock(b){b=b||scope();const m={};for(const x of S.moves)if(b==='ALL'||x.branchId===b){const k=x.loc+'|'+x.p+'|'+(x.lot||'');m[k]=(m[k]||0)+x.q}return m}
function availList(b,type){const m=lotStock(b),out=[],lm={};S.lots.forEach(l=>lm[l.p+'|'+l.no]=l.exp||'');
 for(const k in m){const q=r3(m[k]);if(q<=0)continue;const [loc,p,lot]=k.split('|');if(type){const L=S.locations.find(x=>x.id===loc);if(!L||L.type!==type)continue}out.push({loc,p,lot,q,exp:lot?(lm[p+'|'+lot]||''):''})}
 return out}
function rowsAt(loc,p,lot){const m=lotStock(cur()),out=[];
 for(const k in m){const [a,pp,l]=k.split('|');if(a!==loc||pp!==p)continue;const q=r3(m[k]);if(q<=0)continue;if(lot&&l!==lot)continue;out.push({lot:l,q,exp:l?lotExp(p,l):''})}
 return out.sort((a,b)=>(a.exp||'9999').localeCompare(b.exp||'9999')||natCmp(a.lot,b.lot))}

 for(const k in m){const q=r3(m[k]);if(!q)continue;const [loc,p,lot]=k.split('|');if(!lot&&!tracked(p))continue;const kk=p+'|'+lot;const r=by[kk]=by[kk]||{p,lot,q:0,locs:[]};r.q=r3(r.q+q);r.locs.push(locName(loc)+': '+q)}

function allocate(d,av){av=av||availList(cur(),'storage');const want={};d.lines.forEach(l=>want[l.p]=(want[l.p]||0)+l.q);const out=[],t0=today();
 for(const p in want){let n=want[p],exp=0;
  const all=av.filter(x=>x.p===p&&x.q>0),rows=all.filter(x=>!(x.exp&&x.exp<t0));exp=all.length-rows.length;
  rows.sort(tracked(p)?(a,b)=>(a.exp||'9999').localeCompare(b.exp||'9999')||natCmp(a.lot,b.lot)||b.q-a.q:(a,b)=>b.q-a.q);
  for(const x of rows){if(n<=0)break;const t=r3(Math.min(x.q,n));out.push({p,loc:x.loc,lot:x.lot,q:t});x.q=r3(x.q-t);n=r3(n-t)}
  if(n>0)throw new Error('Not enough '+(exp?'unexpired ':'')+'stock in storage locations for '+prod(p).name+' (short by '+n+')'+(exp?'. '+exp+' expired lot(s) were skipped.':''))}
 return out}
function posAlloc(av,p,q){const parts=[];let n=q;const t0=today();
 const rows=av.filter(x=>x.p===p&&x.q>0&&!(x.exp&&x.exp<t0)).sort((a,b)=>(a.exp||'9999').localeCompare(b.exp||'9999')||natCmp(a.lot,b.lot));
 for(const x of rows){if(n<=0)break;const t=r3(Math.min(x.q,n));parts.push({lot:x.lot,q:t});x.q=r3(x.q-t);n=r3(n-t)}
 if(n>0)parts.push({lot:'',q:n});return parts}

/* receiving */
function postReceipt(o,plan){const rec=locOf('receiving');if(!rec)throw new Error('No RECEIVING BAY location. Add one in Settings.');let val=0;
 plan.forEach(({l,n,parts})=>{const p=prod(l.p),T=Math.max(totalQty(l.p),0),c=lc(l);p.cost=r2((T*p.cost+n*c)/(T+n));p.u=now();
  parts.forEach(x=>{if(x.lot&&!S.lots.some(z=>z.p===l.p&&z.no===x.lot))S.lots.push({id:nid('LT'),p:l.p,no:x.lot,exp:x.exp||'',recv:today(),po:o.no,u:now()});mv(l.p,rec.id,x.q,'receipt',o.no,c,x.lot)});
  l.recLots=(l.recLots||[]).concat(parts.map(x=>({lot:x.lot,q:x.q})));l.rec+=n;val+=n*c});
 if(val>0)je('Receipt '+o.no,'Goods received',[{acc:'1200',dr:val},{acc:'2110',cr:val}]);
 o.status=o.lines.every(l=>l.rec>=l.q)?'received':'partial';touch(o)}
function recvForm(id){if(!need('po.receive'))return;const o=S.po.find(x=>x.id===id);if(!['confirmed','partial'].includes(o.status))return alert('Confirm this order (and get approval if needed) before receiving goods.');
 const lotRow=(l,i)=>{const p=prod(l.p);if(p.track!=='lot'&&p.track!=='serial')return'';const def=p.life>0?addDays(today(),p.life):'';
  return `<tr><td colspan="4"><div class="fg">${p.track==='lot'?`<label>Lot number<input id="lot${i}"></label>`:`<label>Serial numbers (one per line or comma separated)<textarea id="sn${i}" rows="3" style="width:100%;font:inherit"></textarea></label>`}<label>Expiry date (optional)<input id="exp${i}" type="date" value="${def}"></label></div></td></tr>`};
 window._okRecv=()=>{const plan=[];
  for(const inp of $$('#rl input.rq')){const i=+inp.dataset.i,l=o.lines[i],n=Math.min(+inp.value||0,l.q-l.rec);if(n<=0)continue;const p=prod(l.p);let parts;
   if(p.track==='lot'){const lot=cleanLot($('#lot'+i).value);if(!lot)return alert('Enter a lot number for '+p.name);const exp=$('#exp'+i).value,old=lotExp(l.p,lot);
    if(S.lots.some(z=>z.p===l.p&&z.no===lot)&&exp&&old&&old!==exp)return alert('Lot '+lot+' already exists with expiry '+old+'. Use that date or a new lot number.');
    parts=[{lot,q:n,exp:exp||old}]}
   else if(p.track==='serial'){if(n%1)return alert('Serial-tracked items must be whole numbers: '+p.name);const sn=$('#sn'+i).value.split(/[\n,;]+/).map(cleanLot).filter(Boolean),exp=$('#exp'+i).value;
    if(sn.length!==n)return alert(p.name+': enter exactly '+n+' serial numbers (you entered '+sn.length+').');if(new Set(sn).size!==n)return alert(p.name+': a serial number is repeated.');
    const used=sn.find(s=>S.lots.some(z=>z.p===l.p&&z.no===s));if(used)return alert('Serial number '+used+' already exists for '+p.name+'.');
    parts=sn.map(s=>({lot:s,q:1,exp}))}
   else parts=[{lot:'',q:n}];
   plan.push({l,n,parts})}
  try{postReceipt(o,plan)}catch(e){return alert(e.message)}
  fire('po.received',o);closeM();save();render()};
 modal(`<h3>Receive ${o.no}</h3><div class="tw"><table id="rl"><tr><th>Product</th><th>Ordered</th><th>Received</th><th>Receive now</th></tr>${o.lines.map((l,i)=>`<tr><td>${esc(prod(l.p).name)}${tracked(l.p)?` <span class="tag">${prod(l.p).track}</span>`:''}</td><td>${l.q}</td><td>${l.rec}</td><td><input class="rq" type="number" step="any" data-i="${i}" value="${l.q-l.rec}" min="0" max="${l.q-l.rec}"></td></tr>${l.q-l.rec>0?lotRow(l,i):''}`).join('')}</table></div><div class="ac"><button class="b2" onclick="closeM()">Cancel</button><button onclick="_okRecv()">Post receipt</button></div>`,true)}

/* putaway */
function suggestLoc(p){const pr=prod(p),st=stockIdx(cur());
 const rules=S.putrules.filter(r=>r.active!==false&&r.branchId===cur()&&((r.kind==='product'&&r.ref===p)||(r.kind==='category'&&pr.category&&String(r.ref).toLowerCase()===String(pr.category).toLowerCase()))).sort((a,b)=>(a.kind===b.kind?0:a.kind==='product'?-1:1)||(a.prio||0)-(b.prio||0));
 for(const r of rules)if(!r.cap||(st[r.locId+'|'+p]||0)<r.cap)return r.locId;
 const stor=S.locations.filter(l=>l.branchId===cur()&&l.type==='storage');let best='',bq=0;
 stor.forEach(l=>{const q=st[l.id+'|'+p]||0;if(q>bq){bq=q;best=l.id}});if(best)return best;
 const used=new Set(Object.keys(st).filter(k=>st[k]>0).map(k=>k.split('|')[0])),free=stor.filter(l=>!used.has(l.id)).sort((a,b)=>natCmp(a.name,b.name));
 return free.length?free[0].id:''}
function postTransfer(p,from,to,qty,lot){if(from===to)throw new Error('Choose different locations');if(!(qty>0))throw new Error('Quantity must be positive');lot=cleanLot(lot);
 const rows=rowsAt(from,p,lot),parts=[];let n=qty;for(const r of rows){if(n<=0)break;const t=r3(Math.min(r.q,n));parts.push({lot:r.lot,q:t});n=r3(n-t)}
 if(n>0)throw new Error('Not enough stock at '+locName(from)+(lot?' for lot '+lot:''));
 const ref=nextNo('TR');parts.forEach(x=>{mv(p,from,-x.q,'transfer',ref,0,x.lot);mv(p,to,x.q,'transfer',ref,0,x.lot)});return ref}
function xferForm(p,from,lot){if(!need('stock.move')||!S.products.length)return;const L=locOpts(),to=from&&p?suggestLoc(p):'';
 const q0=from&&p?(rowsAt(from,p,lot||'').reduce((a,x)=>a+x.q,0)||1):1;
 openForm(from?'Putaway':'Transfer stock',[{k:'p',label:'Product',type:'select',opts:prodOpts(),val:p},{k:'from',label:'From',type:'select',opts:L,val:from},{k:'to',label:'To',type:'select',opts:L,val:to},{k:'lot',label:'Lot / serial (blank = earliest expiry first)',val:lot||''},{k:'qty',label:'Quantity',type:'number',val:q0}],o=>{postTransfer(o.p,o.from,o.to,o.qty,o.lot)},'Move')}
function putawayAll(){if(!need('stock.move'))return;const rec=locOf('receiving');if(!rec)return alert('No RECEIVING BAY location.');
 const m=lotStock(cur()),jobs=[],skip=[];
 for(const k in m){const [l,p,lot]=k.split('|'),q=r3(m[k]);if(l!==rec.id||q<=0)continue;const to=suggestLoc(p);if(!to){skip.push(prod(p).name);continue}jobs.push({p,lot,q,to})}
 if(!jobs.length)return alert(skip.length?'No suggested location for: '+skip.join(', ')+'. Add a putaway rule or a free storage location.':'Nothing waiting for putaway.');
 if(!confirm('Put away '+jobs.length+' line(s) to their suggested locations?'+(skip.length?'\n\nNo location found for: '+skip.join(', '):'')))return;
 const ref=nextNo('TR');jobs.forEach(j=>{mv(j.p,rec.id,-j.q,'transfer',ref,0,j.lot);mv(j.p,j.to,j.q,'transfer',ref,0,j.lot)});log('putaway',ref+' '+jobs.length+' lines');save();render()}
function ruleForm(){if(!need('putaway.edit'))return;
 openForm('New putaway rule',[{k:'p',label:'Product (leave blank to use a category)',type:'select',opts:[['','—']].concat(prodOpts())},{k:'cat',label:'Category (if no product)'},{k:'loc',label:'Put in location',type:'select',opts:locOpts(['storage'])},{k:'cap',label:'Max units of the product at this location (0 = no limit)',type:'number',val:0},{k:'prio',label:'Priority (lower runs first)',type:'number',val:10}],o=>{
  if(!o.p&&!o.cat.trim())throw new Error('Choose a product or enter a category');if(o.p&&o.cat.trim())throw new Error('Use either a product or a category, not both');if(!o.loc)throw new Error('Choose a location');
  S.putrules.push({id:nid('PU'),branchId:cur(),kind:o.p?'product':'category',ref:o.p||o.cat.trim(),locId:o.loc,cap:o.cap,prio:o.prio,active:true,u:now()});log('putaway rule',(o.p?prod(o.p).name:o.cat)+' → '+locName(o.loc))})}
function ruleOff(id){if(!need('putaway.edit'))return;const r=S.putrules.find(x=>x.id===id);r.active=r.active===false;touch(r);save();render()}

/* adjustments and cycle counts */
function postAdjust(p,loc,lot,cnt,exp){lot=cleanLot(lot);const pr=prod(p);if(tracked(p)&&!lot)throw new Error('Enter the lot / serial number for '+pr.name);
 const m=lotStock(cur()),c0=r3(m[loc+'|'+p+'|'+lot]||0),d=r3(cnt-c0);if(!d)throw new Error('Counted quantity equals system quantity');
 if(pr.track==='serial'&&cnt>1)throw new Error('A serial number can only hold 0 or 1');
 if(lot&&!S.lots.some(x=>x.p===p&&x.no===lot)){if(d<0)throw new Error('Lot '+lot+' does not exist');S.lots.push({id:nid('LT'),p,no:lot,exp:exp||(pr.life>0?addDays(today(),pr.life):''),recv:today(),po:'',u:now()})}
 const v=r2(Math.abs(d)*pr.cost),ref=nextNo('ADJ');mv(p,loc,d,'adjust',ref,pr.cost,lot);
 je(ref,'Stock adjustment',d>0?[{acc:'1200',dr:v},{acc:'5100',cr:v}]:[{acc:'5100',dr:v},{acc:'1200',cr:v}]);log('stock adjust',pr.name+' at '+locName(loc)+(lot?' lot '+lot:'')+' '+(d>0?'+':'')+d);return d}
function adjForm(){if(!need('stock.adjust')||!S.products.length)return;
 openForm('Stock count / adjustment',[{k:'p',label:'Product',type:'select',opts:prodOpts()},{k:'loc',label:'Location',type:'select',opts:locOpts()},{k:'lot',label:'Lot / serial (required for tracked items)'},{k:'exp',label:'Expiry (only for a new lot)',type:'date'},{k:'cnt',label:'Counted quantity',type:'number',val:0}],o=>{postAdjust(o.p,o.loc,o.lot,o.cnt,o.exp)},'Apply')}
function postCount(loc,rows){const ref=nextNo('CNT'),lines=[];let gain=0,loss=0;
 rows.forEach(r=>{const d=r3(r.cnt-r.sys);if(!d)return;const c=prod(r.p).cost,v=r2(Math.abs(d)*c);mv(r.p,loc,d,'adjust',ref,c,r.lot);if(d>0)gain+=v;else loss+=v;lines.push({p:r.p,lot:r.lot,sys:r.sys,cnt:r.cnt,diff:d,cost:c})});
 if(!lines.length)throw new Error('No differences to post');
 je(ref,'Cycle count '+locName(loc),[{acc:'1200',dr:r2(gain)},{acc:'5100',cr:r2(gain)},{acc:'5100',dr:r2(loss)},{acc:'1200',cr:r2(loss)}]);
 S.counts.push({id:nid('CN'),no:ref,branchId:cur(),date:today(),t:now(),loc,lines,by:U.id,byName:U.name,u:now()});log('cycle count',ref+' '+locName(loc)+' · '+lines.length+' differences');return ref}
function countRows(loc){const m=lotStock(cur()),rows=[];for(const k in m){const [a,p,lot]=k.split('|'),q=r3(m[k]);if(a!==loc||!q)continue;rows.push({p,lot,q,exp:lot?lotExp(p,lot):''})}
 return rows.sort((a,b)=>prod(a.p).name.localeCompare(prod(b.p).name)||natCmp(a.lot,b.lot))}
function countForm(loc){if(!need('stock.adjust'))return;const L=locOpts();if(!L.length)return alert('No locations yet.');loc=loc||L[0][0];const rows=countRows(loc);window._cnt={loc,rows};
 window._cntD=inp=>{const r=_cnt.rows[+inp.dataset.i],d=r3(+inp.value-r.q);$('#cd'+inp.dataset.i).textContent=inp.value===''?'':(d>0?'+':'')+d};
 window._prCnt=()=>printDoc(docHTML('Count sheet · '+esc(locName(loc)),today(),['Item','Lot / expiry','System qty','Counted'],_cnt.rows.map(r=>[esc(prod(r.p).name),lotLabel(r.p,r.lot),r.q,'________'])));
 window._okCnt=()=>{const out=[];$$('#cn input').forEach(i=>{if(i.value==='')return;const r=_cnt.rows[+i.dataset.i];out.push({p:r.p,lot:r.lot,sys:r.q,cnt:+i.value})});
  if(!out.length)return alert('Enter at least one counted quantity');if(!confirm('Post '+out.length+' counted line(s)? Differences will adjust stock and the ledger.'))return;
  try{const ref=postCount(_cnt.loc,out);save();closeM();render();alert('Count '+ref+' posted.')}catch(e){alert(e.message)}};
 modal(`<h3>Cycle count</h3><div class="fg"><label>Location<select onchange="countForm(this.value)">${L.map(l=>`<option value="${l[0]}" ${l[0]===loc?'selected':''}>${esc(l[1])}</option>`).join('')}</select></label></div><p class="mu">Enter the quantity you counted. Leave a row blank to skip it. To record stock that is not listed, use Stock count / adjust.</p>
 <div class="tw"><table id="cn"><tr><th>Item</th><th>Lot / expiry</th><th>System</th><th>Counted</th><th>Diff</th></tr>${rows.map((r,i)=>`<tr><td>${esc(prod(r.p).name)}</td><td>${lotLabel(r.p,r.lot)}</td><td>${r.q}</td><td><input type="number" step="any" data-i="${i}" oninput="_cntD(this)"></td><td class="ra" id="cd${i}"></td></tr>`).join('')||'<tr><td colspan="5" class="mu">Nothing recorded at this location.</td></tr>'}</table></div>
 <div class="ac"><button class="b2" onclick="closeM()">Cancel</button><button class="b2" onclick="_prCnt()">Print sheet</button><button onclick="_okCnt()">Post counts</button></div>`,true)}

/* reorder rules / replenishment */
function reorderRows(){const b=cur(),on={},inc={};for(const x of S.moves)if(x.branchId===b)on[x.p]=(on[x.p]||0)+x.q;
 S.po.filter(o=>o.branchId===b&&poOpen(o)).forEach(o=>o.lines.forEach(l=>inc[l.p]=(inc[l.p]||0)+Math.max(0,l.q-l.rec)));
 return S.products.filter(p=>p.reorder>0).map(p=>{const o=r3(on[p.id]||0),i=r3(inc[p.id]||0),tgt=p.max>0?p.max:p.reorder*2,pos=o+i;return{p,on:o,inc:i,need:pos<=p.reorder?Math.max(0,Math.ceil(tgt-pos)):0}}).filter(r=>r.need>0)}
function postReorder(items){const g={},skip=[];
 items.forEach(x=>{const p=prod(x.p);if(!p.vendor){skip.push(p.name);return}(g[p.vendor]=g[p.vendor]||[]).push({p:x.p,q:x.q,c:vprice(p.vendor,x.p,x.q)??p.cost,d:0,rec:0,billed:0})});
 const made=[];for(const v in g){const rec={id:nid('PO'),no:nextNo('PO'),branchId:cur(),date:today(),t:now(),vendorId:v,x:{},lines:g[v],status:'draft',u:now(),by:U.id};S.po.push(rec);made.push(rec.no);fire('po.created',rec)}
 if(made.length)log('reorder POs',made.join(', '));return{made,skip}}
function makeReorder(){if(!need('po.create'))return;const items=$$('#rp tr[data-p]').filter(t=>t.querySelector('.rk').checked).map(t=>({p:t.dataset.p,q:+t.querySelector('.rn').value||0})).filter(x=>x.q>0);
 if(!items.length)return alert('Nothing selected');const r=postReorder(items);save();render();
 alert((r.made.length?'Created RFQs: '+r.made.join(', ')+'. Review and confirm them under Purchases.':'No purchase orders created.')+(r.skip.length?'\nNo preferred vendor set for: '+r.skip.join(', ')+' (set one under Products).':''))}

/* landed costs */
function postLanded(o,vendorId,desc,amt,split){const ls=o.lines.map((l,i)=>({l,i})).filter(x=>x.l.rec>0);if(!ls.length)throw new Error('Nothing has been received on this order yet');
 amt=r2(amt);if(!(amt>0))throw new Error('Enter the cost amount');
 const basis=ls.map(x=>split==='qty'?x.l.rec:x.l.rec*lc(x.l)),sum=basis.reduce((a,b)=>a+b,0);if(!(sum>0))throw new Error('Cannot split: the received value is zero');
 let left=amt;const alloc=ls.map((x,k)=>{const sh=k===ls.length-1?left:r2(amt*basis[k]/sum);left=r2(left-sh);return{p:x.l.p,i:x.i,amt:sh}});
 let inv=0,cogs=0;
 alloc.forEach(a=>{const l=o.lines[a.i],p=prod(a.p),oh=Math.max(totalQty(a.p),0),f=l.rec>0?Math.min(oh,l.rec)/l.rec:0,ip=r2(a.amt*f),cp=r2(a.amt-ip);inv=r2(inv+ip);cogs=r2(cogs+cp);if(oh>0&&ip){p.cost=r2(p.cost+ip/oh);p.u=now()}});
 const bill={id:nid('BL'),no:nextNo('BILL'),branchId:cur(),poId:'',vendorId,date:today(),t:now(),net:amt,tax:0,total:amt,landed:true,ref:o.no,memo:desc,u:now()};S.bills.push(bill);
 je('Landed cost '+o.no,desc,[{acc:'1200',dr:inv},{acc:'5000',dr:cogs},{acc:'2100',cr:amt}]);
 (o.landed=o.landed||[]).push({id:nid('LC'),date:today(),desc,amt,vendorId,split,bill:bill.no,alloc});touch(o);log('landed cost',o.no+' '+desc+' '+amt);return bill}
function landedForm(id){if(!need('landed.cost'))return;const o=S.po.find(x=>x.id===id);if(o.branchId!==cur())return alert('Add landed costs at the branch that received this order.');
 const vs=S.partners.filter(p=>p.type!=='customer').map(p=>[p.id,p.name]);if(!vs.length)return alert('Add a vendor in Contacts first (the freight or customs company).');
 openForm('Landed cost · '+o.no,[{k:'v',label:'Who is owed (vendor)',type:'select',opts:vs,val:o.vendorId},{k:'desc',label:'Description (freight, customs duty…)',val:'Freight'},{k:'amt',label:'Amount (a payable bill is created)',type:'number',val:0},{k:'split',label:'Split across received lines by',type:'select',opts:[['value','Value received'],['qty','Quantity received']]}],f=>{postLanded(o,f.v,f.desc||'Landed cost',f.amt,f.split)},'Post cost')}

/* pick waves */
const waveState=w=>w.doIds.every(i=>{const d=S.dos.find(x=>x.id===i);return !d||d.status!=='draft'})?'picked':'open';
function postPick(d,pk,iss){d.picks=pk;pk.forEach(x=>{mv(x.p,x.loc,-x.q,'pick',d.no,0,x.lot);mv(x.p,iss.id,x.q,'pick',d.no,0,x.lot)});d.status='picked';touch(d)}

 w.doIds.forEach(i=>{const d=S.dos.find(x=>x.id===i);if(!d)return;const pk=d.status==='draft'?allocate(d,av):(d.picks||[]);pk.forEach(x=>m.push({...x,no:d.no}))});return m}

 printDoc(docHTML('Pick Wave '+w.no,w.date+' · '+w.doIds.length+' orders',['Location','Item','Lot / expiry','Qty','For orders','Picked'],Object.values(g).sort((a,b)=>natCmp(locName(a.loc),locName(b.loc))).map(x=>[esc(locName(x.loc)),esc(prod(x.p).name),lotLabel(x.p,x.lot),x.q,esc(x.nos.join(', ')),'☐'])))}
function confirmWave(id){if(!need('do.pick'))return;const w=S.waves.find(x=>x.id===id),iss=locOf('issuing');if(!iss)return alert('No ISSUING BAY location.');

/* returns with lots */
function retLots(src,srcType,x){let srcL;
 if(srcType==='sale')srcL=(src.lines[x.i]||{}).lots||[];
 else{const d=S.dos.find(z=>z.id===src.doId),m={};((d&&d.picks)||[]).filter(k=>k.p===x.p).forEach(k=>m[k.lot||'']=(m[k.lot||'']||0)+k.q);srcL=Object.keys(m).map(k=>({lot:k,q:m[k]}))}

/* vendor bill with 3-way match */
function mkBill(id){if(!need('bill.create'))return;const o=S.po.find(x=>x.id===id),tol=S.settings.matchTol||0;
 const ls=o.lines.map((l,i)=>({l,i,open:r3(l.rec-l.billed)})).filter(x=>x.open>0);if(!ls.length)return alert('Everything received has already been billed.');
 window._okBill=()=>{const vref=$('#bvr').value.trim();if(!vref)return alert('Enter the vendor\'s invoice number.');
  if(S.bills.some(b=>b.vendorId===o.vendorId&&b.vref&&b.vref.toLowerCase()===vref.toLowerCase()))return alert('This vendor invoice number was already entered.');
  const rows=[],flag=[];let net=0,grni=0;
  for(const x of ls){const q=+$('#bq'+x.i).value||0,pr=+$('#bp'+x.i).value;if(q<0)return alert('Quantity cannot be negative');if(q===0)continue;
   if(q>x.open+1e-9)return alert(prod(x.l.p).name+': you can only bill what was received ('+x.open+' left to bill).');
   if(!(pr>=0))return alert('Enter a price for '+prod(x.l.p).name);
   const po=lc(x.l),pct=po>0?Math.abs(pr-po)/po*100:(pr>0?100:0);if(pct>tol+1e-9)flag.push(prod(x.l.p).name+': billed '+money(pr)+', ordered '+money(po));
   rows.push({i:x.i,p:x.l.p,q,price:r2(pr),poPrice:r2(po)});net+=q*pr;grni+=q*po}
  if(!rows.length)return alert('Enter a quantity to bill.');
  net=r2(net);grni=r2(grni);const variance=r2(net-grni),tax=r2(net*S.settings.taxRate/100),total=r2(net+tax);
  const finish=ap=>{const bill={id:nid('BL'),no:nextNo('BILL'),branchId:cur(),poId:o.id,vendorId:o.vendorId,date:today(),t:now(),net,tax,total,vref,lines:rows,variance,match:flag.length?'override':'matched',apprBy:flag.length&&ap&&ap.id!==U.id?ap.name:'',u:now()};S.bills.push(bill);
   je('Bill for '+o.no,'Vendor bill '+vref,[{acc:'2110',dr:grni},{acc:'5200',dr:Math.max(variance,0),cr:Math.max(-variance,0)},{acc:'1300',dr:tax},{acc:'2100',cr:total}]);
   rows.forEach(r=>{o.lines[r.i].billed=r3(o.lines[r.i].billed+r.q)});touch(o);log('vendor bill',bill.no+' '+vref+' '+total+(flag.length?' price variance approved':''));save();closeM();render()};
  if(flag.length&&!can('bill.override')){alert('Price differs from the purchase order by more than '+tol+'%:\n'+flag.join('\n')+'\n\nA manager or accountant must approve this bill.');approve('bill.override',u=>finish(u))}else finish(U)};
 modal(`<h3>Bill for ${o.no}</h3><div class="fg"><label>Vendor invoice number<input id="bvr"></label></div><p class="mu">Enter what the vendor invoiced. Quantities are limited to what you received and have not yet billed.</p><div class="tw"><table><tr><th>Product</th><th>Ordered</th><th>Received</th><th>Billed</th><th>Bill qty</th><th>Unit price (order: price)</th></tr>${ls.map(x=>`<tr><td>${esc(prod(x.l.p).name)}</td><td>${x.l.q}</td><td>${x.l.rec}</td><td>${x.l.billed}</td><td><input id="bq${x.i}" type="number" step="any" min="0" max="${x.open}" value="${x.open}"></td><td><input id="bp${x.i}" type="number" step="any" value="${r2(lc(x.l))}"></td></tr>`).join('')}</table></div><p class="mu">Tolerance for price differences: ${tol}%. VAT is added at ${S.settings.taxRate}%.</p><div class="ac"><button class="b2" onclick="closeM()">Cancel</button><button onclick="_okBill()">Create bill</button></div>`,true)}

/* ============ POS: sessions, cash control, split payments, held orders ============ */
const MLAB={cash:'Cash',card:'Card',transfer:'Bank transfer'};
const curSess=()=>S.sessions.find(s=>s.branchId===cur()&&s.status==='open');
function sessStats(s){const end=s.closeT||Infinity,sales=S.sales.filter(x=>x.sessId===s.id),by={cash:0,card:0,transfer:0};
 sales.forEach(x=>(x.pays||[{m:x.method,amt:x.total}]).forEach(p=>{by[p.m]=r2((by[p.m]||0)+p.amt)}));
 const rets=S.returns.filter(r=>r.kind==='cust'&&r.srcType==='sale'&&r.branchId===s.branchId&&r.t>=s.openT&&r.t<=end),
  cashRef=r2(rets.filter(r=>r.method==='1000').reduce((a,r)=>a+r.total,0)),otherRef=r2(rets.filter(r=>r.method!=='1000').reduce((a,r)=>a+r.total,0)),
  mvs=S.cashmoves.filter(m=>m.sessId===s.id),cin=r2(mvs.filter(m=>m.amt>0).reduce((a,m)=>a+m.amt,0)),cout=r2(-mvs.filter(m=>m.amt<0).reduce((a,m)=>a+m.amt,0));
 return{sales,by,cashRef,otherRef,cin,cout,expected:r2(s.openFloat+by.cash-cashRef+cin-cout),gross:r2(sales.reduce((a,x)=>a+x.gross,0)),disc:r2(sales.reduce((a,x)=>a+x.disc,0)),tax:r2(sales.reduce((a,x)=>a+x.tax,0)),total:r2(sales.reduce((a,x)=>a+x.total,0))}}
function openSess(){if(!need('pos.session'))return;if(curSess())return alert('A session is already open.');
 const raw=$('#ses_f').value,fl=+raw;if(raw===''||!(fl>=0))return alert('Enter the cash in the drawer now (0 if empty).');
 const s={id:nid('SS'),no:nextNo('SES'),branchId:cur(),openT:now(),date:today(),openFloat:r2(fl),status:'open',openBy:U.id,openByName:U.name,note:$('#ses_n').value.trim(),u:now()};
 S.sessions.push(s);log('pos session opened',s.no+' float '+s.openFloat);save();render()}
function cashMoveForm(){if(!need('pos.session'))return;const s=curSess();if(!s)return alert('Open a session first.');
 const accs=S.accounts.filter(a=>a.id!=='1000').sort((a,b)=>a.id.localeCompare(b.id)).map(a=>[a.id,a.id+' · '+a.name]);
 openForm('Cash in / out',[{k:'dir',label:'Direction',type:'select',opts:[['out','Cash out (take money from the drawer)'],['in','Cash in (put money in the drawer)']],val:'out'},{k:'amt',label:'Amount',type:'number',val:0},{k:'reason',label:'Reason'},{k:'acc',label:'Other side of the entry (e.g. Bank for a deposit)',type:'select',opts:accs,val:'6000'}],o=>{
  if(!(o.amt>0))throw new Error('Enter an amount');if(!o.reason.trim())throw new Error('Enter a reason');
  const st=sessStats(s);if(o.dir==='out'&&o.amt>st.expected+0.001&&!confirm('This is more than the cash expected in the drawer ('+money(st.expected)+'). Continue?'))return false;
  const a=o.dir==='in'?o.amt:-o.amt;S.cashmoves.push({id:nid('CM'),sessId:s.id,branchId:cur(),t:now(),date:today(),amt:r2(a),reason:o.reason.trim(),acc:o.acc,by:U.id,byName:U.name,u:now()});
  je(s.no,'Cash '+(o.dir==='in'?'in: ':'out: ')+o.reason.trim(),o.dir==='in'?[{acc:'1000',dr:o.amt},{acc:o.acc,cr:o.amt}]:[{acc:o.acc,dr:o.amt},{acc:'1000',cr:o.amt}]);log('pos cash '+o.dir,s.no+' '+o.amt+' '+o.reason)},'Record')}
function closeSessForm(){if(!need('pos.session'))return;const s=curSess();if(!s)return;const st=sessStats(s);
 window._cd=()=>{const raw=$('#cs_c').value;if(raw===''){$('#cs_v').textContent='';return}const v=r2(+raw-st.expected);$('#cs_v').textContent=(v>0?'+':'')+money(v)+(v>0?' over':v<0?' short':' · exact')};
 window._okClose=()=>{const raw=$('#cs_c').value;if(raw==='')return alert('Enter the cash you counted.');const c=r2(+raw);if(!(c>=0))return alert('Invalid amount.');
  const v=r2(c-st.expected),note=$('#cs_n').value.trim();if(v!==0&&!note)return alert('Explain the difference in the note.');
  if(v>0)je(s.no,'Cash over (session close)',[{acc:'1000',dr:v},{acc:'5300',cr:v}]);if(v<0)je(s.no,'Cash short (session close)',[{acc:'5300',dr:-v},{acc:'1000',cr:-v}]);
  Object.assign(s,{status:'closed',closeT:now(),closeDate:today(),counted:c,expected:st.expected,variance:v,closeNote:note,closeBy:U.id,closeByName:U.name});touch(s);
  log('pos session closed',s.no+' counted '+c+' difference '+v);save();closeM();render();sessReport(s.id)};
 const held=S.holds.filter(h=>h.branchId===cur()&&h.status==='held').length;
 modal(`<h3>Close session ${s.no}</h3><table><tr><td>Opening float</td><td class="ra">${money(s.openFloat)}</td></tr><tr><td>Cash sales (${st.sales.length} receipts, all methods ${money(st.total)})</td><td class="ra">+${money(st.by.cash)}</td></tr><tr><td>Cash refunds</td><td class="ra">−${money(st.cashRef)}</td></tr><tr><td>Cash in</td><td class="ra">+${money(st.cin)}</td></tr><tr><td>Cash out</td><td class="ra">−${money(st.cout)}</td></tr><tr><td><b>Expected in drawer</b></td><td class="ra"><b>${money(st.expected)}</b></td></tr></table>
 <div class="fg" style="margin-top:8px"><label>Cash counted<input id="cs_c" type="number" step="any" oninput="_cd()"></label><label>Note (required if there is a difference)<input id="cs_n"></label></div><p>Difference: <b id="cs_v"></b></p>${held?`<p class="mu">${held} held order(s) will stay held for the next session.</p>`:''}<div class="ac"><button class="b2" onclick="closeM()">Cancel</button><button onclick="_okClose()">Close session</button></div>`)}
function sessReport(id){const s=S.sessions.find(x=>x.id===id),st=sessStats(s);
 const R=(a,b,bold)=>`<tr><td>${bold?'<b>'+a+'</b>':a}</td><td class="ra">${bold?'<b>'+b+'</b>':b}</td></tr>`;
 modal(`<div id="zr"><h3>${esc(S.settings.company)} · Session ${s.no}</h3><p class="mu">${esc(br(s.branchId).name)} · opened ${new Date(s.openT).toLocaleString()} by ${esc(s.openByName||'')}${s.closeT?' · closed '+new Date(s.closeT).toLocaleString()+' by '+esc(s.closeByName||''):' · still open'}</p>
 <table>${R('Receipts',st.sales.length)}${R('Gross sales',money(st.gross))}${R('Discounts','−'+money(st.disc))}${R('Tax',money(st.tax))}${R('Total takings',money(st.total),1)}</table>
 <h4>By payment method</h4><table>${R('Cash',money(st.by.cash))}${R('Card',money(st.by.card))}${R('Bank transfer',money(st.by.transfer))}</table>
 <h4>Cash drawer</h4><table>${R('Opening float',money(s.openFloat))}${R('Cash sales','+'+money(st.by.cash))}${R('Cash refunds','−'+money(st.cashRef))}${R('Cash in','+'+money(st.cin))}${R('Cash out','−'+money(st.cout))}${R('Expected',money(s.closeT?s.expected:st.expected),1)}${s.closeT?R('Counted',money(s.counted))+R('Difference',(s.variance>0?'+':'')+money(s.variance)+(s.variance>0?' over':s.variance<0?' short':''),1):''}</table>
 ${st.otherRef?`<p class="mu">Refunds paid to bank/card: ${money(st.otherRef)}</p>`:''}${s.closeNote?`<p>Note: ${esc(s.closeNote)}</p>`:''}</div><div class="ac"><button class="b2" onclick="closeM()">Close</button><button onclick="printDoc($('#zr').innerHTML)">Print</button></div>`,true)}
function sessPanel(){if(!can('pos.session'))return'';const ss=S.sessions.filter(inS).sort((a,b)=>b.openT-a.openT).slice(0,8);if(!ss.length)return'';
 return `<div class="pn"><h3>POS sessions</h3><div class="tw"><table><tr><th>Session</th><th>Opened</th><th>Closed</th><th>Cashier</th><th>Takings</th><th>Difference</th><th></th></tr>${ss.map(s=>`<tr><td>${s.no}</td><td>${new Date(s.openT).toLocaleString()}</td><td>${s.closeT?new Date(s.closeT).toLocaleString():'<span class="tag partial">open</span>'}</td><td>${esc(s.openByName||'')}</td><td>${money(sessStats(s).total)}</td><td class="${s.variance<0?'low':''}">${s.closeT?(s.variance>0?'+':'')+money(s.variance):''}</td><td class="ra"><button class="b2 sm" onclick="sessReport('${s.id}')">Report</button></td></tr>`).join('')}</table></div></div>`}

  S.holds.push({id:nid('H'),no:nextNo('HOLD'),branchId:cur(),t:now(),cust,disc,lines:cart.map(l=>({p:l.p,q:l.q,d:l.d||0})),note:o.note.trim(),by:U.id,byName:U.name,status:'held',u:now()});

 if(cart.length&&!confirm('Replace the items currently in the cart?'))return;

/* split payments */
function payPOS(){if(!need('pos.sell')||!cart.length)return;const c=calc();
 if(S.settings.posSess&&!curSess())return alert('Open a POS session first.');
 const go=()=>{pays=[];payModal()};
 apprU=null;if(c.maxD>S.settings.maxDisc&&!can('pos.disc.high'))approve('pos.disc.high',u=>{apprU=u;go()});else go()}
function payModal(){const c=calc(),paid=r2(pays.reduce((a,x)=>a+x.amt,0)),rem=r2(c.total-paid);
 window._addPay=()=>{const m=$('#pm').value,a=+$('#pt').value;if(!(a>0))return alert('Enter an amount.');if(rem<=0.001)return alert('The sale is already fully paid.');
  if(m!=='cash'&&a>rem+0.001)return alert('A card or transfer payment cannot be more than the amount due ('+money(rem)+').');pays.push({m,amt:r2(a)});payModal()};
 modal(`<h3>Payment · ${money(c.total)}</h3>${pays.length?`<table>${pays.map((x,i)=>`<tr><td>${MLAB[x.m]}</td><td class="ra">${money(x.amt)}</td><td class="ra"><button class="b2 sm" onclick="pays.splice(${i},1);payModal()">✕</button></td></tr>`).join('')}</table>`:''}

 <p class="mu">Paying with more than one method? Enter the first amount, press Add payment, then the next. For a single payment just press Complete sale.</p>

 catch(e){U=null;if(++fails>=5){fails=0;lockUntil=now()+30000}alert(/invalid login/i.test(e.message)?'Wrong username or password':e.message)}}
async function cloudSetup(){const n=$('#su_n').value.trim(),u=$('#su_u').value.trim().toLowerCase(),p=$('#su_p').value;
 if(!n||!u)return alert('Name and username are required');if(!/^[a-z0-9._-]+$/.test(u))return alert('Username: letters, numbers, dot, dash or underscore only');if(p.length<6)return alert('Password must be at least 6 characters');if(p!==$('#su_p2').value)return alert('Passwords do not match');
 try{let uid;try{uid=await DB.signUpMain(u,p)}catch(e){if(/already/i.test(e.message)){uid=(await DB.signIn(u,p)).id}else throw e}
  await DB.addProfile({id:uid,username:u,name:n,role:'admin',branch_id:'ALL',active:true});CS.setup=false;await cloudEnter(uid);page='dash';bump();render()}catch(e){alert(e.message)}}
function cloudGate(){const brand=`<div class="lb"><span class="logo">${icon('dash')}</span>${esc(S.settings.company)}</div>`;
 if(CS.err==='lib')return `<div class="login"><div class="pn">${brand}<h2>Cannot connect</h2><p class="mu">The cloud library could not load. Check your internet connection and reload the page.</p></div></div>`;
 if(CS.setup)return `<div class="login"><div class="pn">${brand}<h2>Welcome. Create the administrator</h2><p class="mu">This is the first account for the company database. It manages users, roles and settings. Keep the password safe.</p><div class="fg"><label>Full name<input id="su_n"></label><label>Username<input id="su_u" autocomplete="off"></label><label>Password (min 6)<input id="su_p" type="password"></label><label>Repeat password<input id="su_p2" type="password"></label></div><div class="ac"><button onclick="cloudSetup()">Create &amp; sign in</button></div></div></div>`;
 return `<div class="login"><div class="pn">${brand}<h2>Sign in</h2><p class="sub">Enter your details to continue.</p>${CS.err?`<p class="low">${esc(CS.err)}</p>`:''}<div class="fg" style="grid-template-columns:1fr"><label>Username<input id="lu" autocomplete="username"></label><label>Password<input id="lpw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')cloudLogin()"></label></div><div class="ac"><button onclick="cloudLogin()">Sign in</button></div></div></div>`}
function userFormCloud(id){const u=S.users.find(x=>x.id===id)||{name:'',username:'',role:'sales',branchId:'ALL',active:true};
 openForm(id?'Edit user':'New user',[{k:'name',label:'Full name',val:u.name},{k:'username',label:id?'Username (cannot be changed)':'Username',val:u.username},{k:'role',label:'Department / role',type:'select',opts:Object.keys(ROLES).map(k=>[k,ROLES[k].label]),val:u.role},{k:'branchId',label:'Branch access',type:'select',opts:[['ALL','All branches']].concat(S.branches.map(b=>[b.id,b.name])),val:u.branchId},{k:'active',label:'Status',type:'select',opts:[['y','Active'],['n','Disabled']],val:u.active===false?'n':'y'}].concat(id?[]:[{k:'pw',label:'Password (min 6)',type:'password'}]),o=>{
  const un=o.username.trim().toLowerCase(),active=o.active==='y';if(!o.name||!un)throw new Error('Name and username are required');
  if(!id){if(!/^[a-z0-9._-]+$/.test(un))throw new Error('Username: letters, numbers, dot, dash or underscore only');if(S.users.some(x=>x.username===un))throw new Error('Username already taken');if((o.pw||'').length<6)throw new Error('Password must be at least 6 characters')}
  if(id&&u.role==='admin'&&(o.role!=='admin'||!active)&&S.users.filter(x=>x.role==='admin'&&x.active!==false&&x.id!==id).length===0)throw new Error('There must be at least one active administrator');
  (async()=>{try{if(id)await DB.setProfile(id,{name:o.name,role:o.role,branch_id:o.branchId,active});else{const uid=await DB.signUpOther(un,o.pw);await DB.addProfile({id:uid,username:un,name:o.name,role:o.role,branch_id:o.branchId,active:true})}
   log('user '+(id?'edited':'created'),un+' ('+o.role+')');S.users=(await DB.profiles()).map(mapP);closeM();save();render()}catch(e){alert(e.message)}})();return false})}
function accountPanel(){return `<div class="pn"><h3>My account</h3><p class="mu">Signed in as <b>${esc(U.username)}</b>. Data is stored in the company database and shared between devices${CS.state==='synced'?' (all changes saved)':CS.state==='error'?' — <span class="low">sync problem: '+esc(CS.err)+'</span>':' (syncing…)'}.</p><div class="tb"><button class="b2" onclick="changeMyPw()">Change my password</button><button class="b2" onclick="pullNow(true).then(()=>pushNow()).then(()=>alert('Sync finished'))">Sync now</button></div></div>`}
function changeMyPw(){openForm('Change my password',[{k:'p1',label:'New password (min 6)',type:'password'},{k:'p2',label:'Repeat password',type:'password'}],o=>{if(o.p1.length<6)throw new Error('Password must be at least 6 characters');if(o.p1!==o.p2)throw new Error('Passwords do not match');
 DB.changePw(o.p1).then(()=>{closeM();alert('Password changed')}).catch(e=>alert(e.message));return false})}

 bump();render()})();
